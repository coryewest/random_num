<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unique Number Generator</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 95vh;
      font-family: Arial, sans-serif;
      font-size: 14px;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input,
    button {
      padding: 10px;
    }

    .result {
      margin-top: 20px;
      padding: 10px;
      background-color: #f0f0f0;
      border-radius: 5px;
    }

    .error {
      color: red;
    }

    .content {
      flex: 1;
    }
  </style>
</head>

<body>
  <main class="content">
    <h1>Unique Number Generator</h1>

    <form action="{{ url_for('index') }}" method="POST">
      <p>Range: 1000 - 9999</p>
      <button type="submit">Generate Unique Number</button>
    </form>

    {% if unique_number is not none %}
    <div class="result">
      <h2>Generated Unique Number: {{ unique_number }}</h2>
    </div>
    {% endif %}

    {% if error_message %}
    <div class="result error">
      <p>{{ error_message }}</p>
    </div>
    {% endif %}
  </main>

  <footer>
    <span>Powered by</span>
    <img src="{{ url_for('static', filename='img/redhat-com-wordmark.jpg') }}" alt="Red Hat logo"
      style="height: 16px; max-width: 140px;">
  </footer>
</body>

</html>
